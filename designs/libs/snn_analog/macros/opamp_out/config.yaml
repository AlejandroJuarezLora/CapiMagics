# ============================================================
# CONFIGURACION GENERAL
# ============================================================

meta:
  version: 3
  flow: Classic


# --- Para las dos celdas del amplificador operacional ---
DESIGN_NAME: opamp_out

VERILOG_FILES:
  - dir::opamp_out.v

IO_PIN_ORDER_CFG: dir::pin.cfg


# ============================================================
# FLOORPLANNING
# ============================================================

FP_SIZING: absolute

# --- Dimensiones del circuito ---
# MODIFICADO: Espacio para dos amplificadores

DIE_AREA:
  - 0
  - 0
  - 121 #116 
  - 80  #70

CORE_AREA:
  - 11
  - 11
  - 110 #105
  - 70 #59


# --- Espacio de Proteccion de las Macros ---
FP_MACRO_HORIZONTAL_HALO: 1.0
FP_MACRO_VERTICAL_HALO: 1.0


# --- Margenes de la PDN alrededor de las macros ---
PDN_HORIZONTAL_HALO: 1
PDN_VERTICAL_HALO: 1


# ============================================================
# CONFIGURACION DE PUERTOS DE ENTRADA Y SALIDA
# ============================================================

IO_PIN_H_LENGTH: 2.5
IO_PIN_V_LENGTH: 2.5

IO_PIN_V_THICKNESS_MULT: 3
IO_PIN_H_THICKNESS_MULT: 3


# ============================================================
# REDES DE ALIMENTACION Y TIERRA
# ============================================================

VDD_NETS:
  - avdd

GND_NETS:
  - avss


# --- Bibliotecas de Pads ---
PAD_LIBS: {}


# ============================================================
# CONFIGURACION GENERAL DE LA PDN
# ============================================================

PDN_ENABLE_RAILS: false
PDN_MULTILAYER: true

#PDN_CFG: dir::pdn_custom.tcl

# --- Ancho y Separacion de los rieles de Alimentacion ---

PDN_VWIDTH: 1.2
PDN_HWIDTH: 1.2

PDN_VSPACING: 2
PDN_HSPACING: 2

# --- Distribucion de los rieles de Alimentacion ---

PDN_VPITCH: 14 #14
PDN_HPITCH: 19.2 #19.2

PDN_VOFFSET: 1
PDN_HOFFSET: 10

# --- Anillo de Alimentacion (PDN Core Ring) ---

PDN_CORE_RING: true

PDN_CORE_RING_VWIDTH: 1.5
PDN_CORE_RING_HWIDTH: 1.5

PDN_CORE_RING_VSPACING: 1.5
PDN_CORE_RING_HSPACING: 1.5


# ============================================================
# CONEXION DE ALIMENTACION DE LAS MACROS
# ============================================================

PDN_CONNECT_MACROS_TO_GRID: true
PDN_ENABLE_GLOBAL_CONNECTIONS: true


# --- MODIFICADO: Conexion de ambas instancias ---

PDN_MACRO_CONNECTIONS:
  - "x1 avdd avss avdd avss"
  - "x2 avdd avss avdd avss"


# ============================================================
# VERIFICACIONES DE LA RED DE ALIMENTACION
# ============================================================

ERROR_ON_PDN_VIOLATIONS: false


# --- Verificacion XOR ---
ERROR_ON_XOR_ERROR: true


# ============================================================
# COLOCACION Y OPTIMIZACION
# ============================================================

PL_TIMING_DRIVEN: false

RUN_POST_GPL_DESIGN_REPAIR: false
RUN_REPAIR_DESIGN: false

RUN_CTS: false
RUN_POST_CTS_RESIZER_TIMING: false
RUN_POST_GRT_RESIZER_TIMING: false


# --- Reparacion de Antenas ---
RUN_HEURISTIC_DIODE_INSERTION: false


# --- Insercion de Celdas Adicionales ---
RUN_FILL_INSERTION: false
RUN_TAP_ENDCAP_INSERTION: false


# ============================================================
# CONFIGURACION GENERAL DE ENRUTAMIENTO
# ============================================================

RT_MIN_LAYER: Metal1
RT_MAX_LAYER: Metal5

ROUTING_CORES: 12
GRT_ALLOW_CONGESTION: true


# ============================================================
# EXPORTACION DEL LAYOUT GDS
# ============================================================

PRIMARY_GDSII_STREAMOUT_TOOL: klayout

MAGIC_ZEROIZE_ORIGIN: false


# ============================================================
# CONFIGURACION DE MAGIC Y KLAYOUT
# ============================================================

ERROR_ON_MAGIC_DRC: false
MAGIC_EXT_UNIQUE: notopports

KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true


# ============================================================
# DEFINICION E INSTANCIACION DE MACROS ANALOGICAS
# ============================================================

MACROS:

  opamp:

    gds:
      - /foss/designs/libs/snn_analog/layout/opamp/opamp.gds

    lef:
      - /foss/designs/libs/snn_analog/layout/opamp/opamp.lef

    spice:
      - /foss/designs/libs/snn_analog/layout/opamp/opamp.spice

    vh:
      - /foss/designs/libs/snn_analog/layout/opamp/opamp.v

    lib:
      "*":
        - /foss/designs/libs/snn_analog/layout/opamp/opamp.lib


    # --------------------------------------------------------
    # INSTANCIAS DEL AMPLIFICADOR OPERACIONAL
    # --------------------------------------------------------

    instances:

      # --- Amplificador operacional 1 ---
      x1:
        location: [13, 13]
        orientation: N

      # --- Amplificador operacional 2 ---
      x2:
        location: [70, 13]
        orientation: N
