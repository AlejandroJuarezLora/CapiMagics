DESIGN_NAME: layer_input

# --- RTL del top: instancia las 4 neuronas
VERILOG_FILES:
  - dir::src/layer_input.v
# --- Declaracion de la macro neurona_input_current ---
MACROS:
  neurona_input_current:
    gds:
      - /eda/designs/CapiMagics/designs/libs/snn_analog/lif/neurona_input_current.gds
    lef:
      - /eda/designs/CapiMagics/designs/libs/snn_analog/lif/neurona_input_current.lef

    # Posicion/orientacion de cada instancia. Los nombres deben
    # coincidir EXACTAMENTE con los nombres de instancia en layer_input.v
    # Calculado a partir del LEF real: SIZE 57.860 BY 27.250 (W x H, en um)
    # Margen de 10um a los bordes del die y 10um de canal de ruteo
    # entre cada instancia (altura de fila = 27.25 + 10 = 37.25um):
    #   x1: y = 10
    #   x2: y = 10 + 37.25         = 47.25
    #   x3: y = 47.25 + 37.25      = 84.5
    #   x4: y = 84.5 + 37.25       = 121.75
    instances:
      x1:
        location: [10, 10]
        orientation: N
      x2:
        location: [10, 47.25]
        orientation: N
      x3:
        location: [10, 84.5]
        orientation: N
      x4:
        location: [10, 121.75]
        orientation: N

# --- Floorplan calculado a partir del LEF real de neurona_lvs ---
# Ancho:  10 (margen izq) + 57.86 (macro) + 10 (margen der) = 77.86 -> 80
# Alto:   10 (margen inf) + 4*27.25 (macros) + 3*10 (canales) + 10 (margen sup)
#         = 10 + 109 + 30 + 10 = 159
DIE_AREA: [0, 0, 80, 159]
FP_SIZING: absolute
PDK: gf180mcuD
STD_CELL_LIBRARY: gf180mcu_fd_sc_mcu7t5v0
