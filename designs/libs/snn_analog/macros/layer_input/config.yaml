meta:
  version: 3
  flow: Classic

DESIGN_NAME: layer_input

VERILOG_FILES:
  - dir::layer_input.v

# --- Parámetros de Floorplanning ---
FP_SIZING: absolute
DIE_AREA:
  - 0
  - 0
  - 485
  - 245
CORE_AREA:
  - 5
  - 5
  - 480
  - 240

# --- Alimentación y Potencia ---
VDD_NETS:
  - vdd
GND_NETS:
  - vss

# Mapeo de alimentación para los macros analógicos
PDN_MACRO_CONNECTIONS:
  - "x1 vdd vss vdd vss"
  - "x2 vdd vss vdd vss"
  - "x3 vdd vss vdd vss"
  - "x4 vdd vss vdd vss"

FP_PDN_MACRO_HOOKS: 
  - "x1 vdd vss vdd vss"
  - "x2 vdd vss vdd vss"
  - "x3 vdd vss vdd vss"
  - "x4 vdd vss vdd vss"


# --- Desactivar pasos digitales innecesarios para diseño analógico puro ---
RUN_POST_GPL_DESIGN_REPAIR: false
RUN_REPAIR_DESIGN: false
RUN_CTS: false
RUN_POST_CTS_RESIZER_TIMING: false
RUN_POST_GRT_RESIZER_TIMING: false
RUN_HEURISTIC_DIODE_INSERTION: false

# --- Desactivar la cuadrícula de celdas estándar en PDN ---
FP_PDN_ENABLE_RAILS: false
FP_PDN_MULTILAYER: false
FP_PDN_AUTO_ADJUST: false

# Asegurar que el floorplan inicialice el grid de sitio estándar del PDK aunque no haya celdas
FP_PDN_CHECK_NODES: false
RUN_TAP_ENDCAP_INSERTION: false




# --- Enrutamiento (GF180MCU) ---
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
RT_MIN_LAYER: Metal3
RT_MAX_LAYER: Metal5
ROUTING_CORES: 12
GRT_ALLOW_CONGESTION: true

# --- Halo para aislar la macro del generador de PDN ---
FP_MACRO_HORIZONTAL_HALO: 4
FP_MACRO_VERTICAL_HALO: 4


#PND

# PDN - Straps
PDN_VWIDTH: 5
PDN_HWIDTH: 5
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN - Core ring
PDN_CORE_RING: True
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
#PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_ENABLE_PINS: False


# --- Definición de Macros Analógicos ---
MACROS:
  neurona_lvs:
    gds:
      - dir::../../lif/neurona_lvs.gds
    lef:
      - dir::../../lif/neurona_lvs.lef
    spice:
      - dir::../../lif/neurona_sch.spice
    vh:
      - dir::../../lif/neurona_lvs.v
    instances:
      x1:
        location:
          - 50
          - 50
        orientation: N
      x2:
        location:
          - 200
          - 50
        orientation: N
      x3:
        location:
          - 50
          - 150
        orientation: N
      x4:
        location:
          - 200
          - 150
        orientation: N
