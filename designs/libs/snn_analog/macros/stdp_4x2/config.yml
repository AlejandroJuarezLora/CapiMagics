meta:
  version: 3
  flow: Classic

DESIGN_NAME: stdp_4x2

# --- RTL del top ---
VERILOG_FILES:
  - dir::stdp_4x2.v
  - dir::../../stdp/stdp.v

# --- Parámetros de Floorplaning (Alineados a rejilla 7T GF180MCU) ---
FP_SIZING: absolute
DIE_AREA:
  - 0
  - 0
  - 450
  - 200
# CORE_AREA:
#   - 10.08
#   - 11.76
#   - 430.08
#   - 180.32

# --- Alimentación y Potencia ---
VDD_NETS:
  - avdd
  
GND_NETS:
  - avss

# --- Manejo de Verificaciones para Diseños Analógicos / Macros ---
ERROR_ON_LINTER_ERRORS: false
ERROR_ON_LINTER_WARNINGS: false
ERROR_ON_UNMAPPED_CELLS: false
ERROR_ON_SYNTH_CHECKS: false
ERROR_ON_NL_ASSIGN_STATEMENTS: false


# ---- FLAGS PDN
PDN_ENABLE_RAILS: false
PDN_MULTILAYER: true
PDN_VWIDTH: 1
PDN_HWIDTH: 1
PDN_VSPACING: 2
PDN_HSPACING: 2
PDN_VPITCH: 75
PDN_HPITCH: 75
PDN_CORE_RING: true
PDN_CORE_RING_VWIDTH: 1.5
PDN_CORE_RING_HWIDTH: 1.5

# Conexión directa de alimentación a los pines y rieles de cada macro
PDN_MACRO_CONNECTIONS:
  - "x1 avdd avss avdd avss"
  - "x2 avdd avss avdd avss"
  - "x3 avdd avss avdd avss"
  - "x4 avdd avss avdd avss"
  - "x5 avdd avss avdd avss"
  - "x6 avdd avss avdd avss"
  - "x7 avdd avss avdd avss"
  - "x8 avdd avss avdd avss"
  - "x9 avdd avdd"
  - "x10 avdd avdd"

# --- Blackbox & Analog Optimization (Valid LibreLane Flags) ---
PL_TIMING_DRIVEN: false            # Disables OpenROAD timing-driven placement
RUN_POST_GPL_DESIGN_REPAIR: false
RUN_REPAIR_DESIGN: false
RUN_CTS: false
RUN_POST_CTS_RESIZER_TIMING: false
RUN_POST_GRT_RESIZER_TIMING: false
RUN_HEURISTIC_DIODE_INSERTION: false
RUN_FILL_INSERTION: false
RUN_TAP_ENDCAP_INSERTION: false
ERROR_ON_PDN_VIOLATIONS: false


# --- Direct LEF/GDS Blackbox Include ---
EXTRA_LEFS:
  - /foss/designs/libs/snn_analog/stdp/stdp.lef
  - /foss/designs/libs/snn_analog/Current_limit/Current_limit.lef
EXTRA_GDS:
  - /foss/designs/libs/snn_analog/stdp/stdp.gds
  - /foss/designs/libs/snn_analog/Current_limit/Current_limit.gds

# --- Routing (GF180MCU) ---
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
MAGIC_ZEROIZE_ORIGIN: false
ERROR_ON_MAGIC_DRC: false
KLAYOUT_FILLER_OPTIONS:
  Metal2_ignore_active: true
MAGIC_EXT_UNIQUE: notopports

MAGIC_GDS_FLATGLOB:
- "*_CDNS_*"
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"
RT_MIN_LAYER: Metal3
RT_MAX_LAYER: Metal5
ROUTING_CORES: 12
GRT_ALLOW_CONGESTION: true


# --- Definición de Macros Analógicos ---
MACROS:
  stdp:
    gds:
      - dir::../../stdp/stdp.gds
    lef:
      - dir::../../stdp/stdp.lef
    spice:
      - dir::../../stdp/stdp.spice
    vh:
      - dir::../../stdp/stdp.v
    instances:
      x1:
        location: [5, 50]
        orientation: N
      x2:
        location: [5, 137]
        orientation: N
      x3:
        location: [5, 217]
        orientation: N
      x4:
        location: [5, 304]
        orientation: N
      x5:
        location: [122, 304]
        orientation: N
      x6:
        location: [122, 217]
        orientation: N
      x7:
        location: [122, 137]
        orientation: N
      x8:
        location: [122, 50]
        orientation: N

  Current_limit:
    gds:
      - dir::../../Current_limit/Current_limit.gds
    lef:
      - dir::../../Current_limit/Current_limit.lef
    spice:
      - dir::../../Current_limit/Current_limit.spice
    vh:
      - dir::../../Current_limit/Current_limit.v
    instances:
      x9:
        location: [41, 5]
        orientation: N
      x10:
        location: [158, 5]
        orientation: N
